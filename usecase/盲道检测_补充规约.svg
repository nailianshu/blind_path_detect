<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1172" viewBox="0 0 1280 1172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1280" height="1172" fill="#FFFFFF"/>
<text x="72" y="78" font-size="36" font-weight="700" fill="#1F3864">盲道检测系统 补充规约</text>
<line x1="72" y1="98" x2="1208" y2="98" stroke="#1F3864" stroke-width="3"/>
<text x="72" y="154" font-size="23" font-weight="700" fill="#1F3864">1. 目标</text>
<text x="72" y="192" font-size="19" fill="#333333">本文档的目的是定义盲道检测系统的需求。本补充规约列出了不便于在用例模型的用例中获取的系统需求，它与用例模型一起记录关于</text>
<text x="72" y="222" font-size="19" fill="#333333">系统的一整套需求。</text>
<text x="72" y="262" font-size="23" font-weight="700" fill="#1F3864">2. 范围</text>
<text x="72" y="300" font-size="19" fill="#333333">本补充规约适用于盲道检测系统，除定义了在许多用例中共有的功能性需求以外，还定义了系统的非功能性需求，例如：可靠性、可用</text>
<text x="72" y="330" font-size="19" fill="#333333">性、性能和可支持性。（功能性需求在用例规约中定义。）</text>
<text x="72" y="370" font-size="23" font-weight="700" fill="#1F3864">3. 参考</text>
<text x="72" y="408" font-size="19" fill="#333333">无</text>
<text x="72" y="448" font-size="23" font-weight="700" fill="#1F3864">4. 功能</text>
<text x="90" y="486" font-size="19" fill="#333333">1) 系统必须能同时处理视频、图片与摄像头三类检测素材。</text>
<text x="90" y="516" font-size="19" fill="#333333">2) 本地检测与远程监视必须能并发执行。</text>
<text x="90" y="546" font-size="19" fill="#333333">3) 若某一帧未检出盲道，系统必须显式提示「无法判断」，不得以 0 代替。</text>
<text x="90" y="576" font-size="19" fill="#333333">4) 对连续未检出超过设定时长的情况，系统必须给出独立提示。</text>
<text x="90" y="606" font-size="19" fill="#333333">5) 系统必须对偏移程度与方向做联合判定，并输出分级提示。</text>
<text x="72" y="646" font-size="23" font-weight="700" fill="#1F3864">5. 可行性</text>
<text x="72" y="684" font-size="19" fill="#333333">桌面用户界面应与 macOS（Apple Silicon）兼容。</text>
<text x="72" y="714" font-size="19" fill="#333333">推理应支持 MPS 加速，以保证离线分析的实时性。</text>
<text x="72" y="754" font-size="23" font-weight="700" fill="#1F3864">6. 可靠性</text>
<text x="72" y="792" font-size="19" fill="#333333">系统在检测过程中应稳定运行；推理线程异常退出时应释放其所占资源。</text>
<text x="72" y="822" font-size="19" fill="#333333">跨线程信号队列不得无界堆积。</text>
<text x="72" y="852" font-size="19" fill="#333333">视频写入器等资源须由创建它的线程释放。</text>
<text x="72" y="892" font-size="23" font-weight="700" fill="#1F3864">7. 性能</text>
<text x="72" y="930" font-size="19" fill="#333333">稳态推理帧率应不低于约 25 FPS（单帧约 22–40 ms）。</text>
<text x="72" y="960" font-size="19" fill="#333333">首帧包含设备预热，性能读数应以稳态值为准。</text>
<text x="72" y="990" font-size="19" fill="#333333">远程视频流推送不得拖慢本地推理与界面刷新。</text>
<text x="72" y="1030" font-size="23" font-weight="700" fill="#1F3864">8. 可支持性</text>
<text x="72" y="1068" font-size="19" fill="#333333">系统应提供使用手册与项目记录，便于后续维护与交接。</text>
<text x="72" y="1098" font-size="19" fill="#333333">界面控件命名与模块划分应保持清晰，便于扩展。</text>
</svg>